<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairos Global // Central Bank Terminal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  
  <!-- External stylesheet link -->
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { background-color: #030305; color: #d4d4d8; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030305; }
    ::-webkit-scrollbar-thumb { background: #18181b; border-radius: 3px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: #22d3ee; }
  </style>
</head>
<body class="bg-[#020203] text-zinc-300 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- 1. DYNAMIC HEADER CONTAINER -->
  <div id="global-header"></div>

  <!-- 2. MAIN CONTENT -->
  <main class="flex-grow w-full max-w-7xl mx-auto px-4 md:px-8 py-8 space-y-8">
    
    <!-- Top Control Bar -->
    <div class="bg-[#07080d] p-6 rounded-2xl border border-zinc-800 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>🏦</span> G10 Central Bank Rate Expectations & Terminal
        </h1>
        <p class="text-zinc-400 text-xs mt-1">Real-time monetary policy expectations, automated tone classification, and decision countdowns</p>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <a href="../tools.html" class="font-mono text-[11px] text-zinc-400 hover:text-cyan-400 transition-colors border border-zinc-800 bg-[#08080c] px-3 py-2 rounded-lg">
          &larr; VOLVER AL CENTRO DE HERRAMIENTAS
        </a>
        <label for="bankSelect" class="text-xs font-mono text-zinc-400 uppercase">Vista:</label>
        <select id="bankSelect" onchange="switchBankView(this.value)" class="bg-[#030305] border border-zinc-700 text-white text-xs rounded-xl px-3 py-2 font-mono focus:outline-none focus:border-cyan-400">
          <option value="Overview">Overview (All Banks)</option>
          <option value="FED">Federal Reserve (FED)</option>
          <option value="ECB">European Central Bank (ECB)</option>
          <option value="BOE">Bank of England (BOE)</option>
          <option value="RBA">Reserve Bank of Australia (RBA)</option>
          <option value="BOC">Bank of Canada (BOC)</option>
          <option value="RBNZ">Reserve Bank of NZ (RBNZ)</option>
          <option value="BOJ">Bank of Japan (BOJ)</option>
          <option value="SNB">Swiss National Bank (SNB)</option>
        </select>
      </div>
    </div>

    <!-- VIEW CONTAINER -->
    <div id="terminalViewContainer" class="space-y-6">
      <!-- Dynamic Content Injected Here -->
    </div>

  </main>

  <!-- 3. DYNAMIC FOOTER CONTAINER -->
  <div id="global-footer"></div>

  <!-- INJECTION ENGINE SCRIPT -->
  <script src="../js/inject-engine.js"></script>

  <script>
    // Clock Engine (Safeguarded for Dynamic Header Injection)
    setInterval(() => {
        const opts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        try {
            if (document.getElementById('clock-ny')) document.getElementById('clock-ny').textContent = new Intl.DateTimeFormat('en-US', { ...opts, timeZone: 'America/New_York' }).format(new Date());
            if (document.getElementById('clock-lon')) document.getElementById('clock-lon').textContent = new Intl.DateTimeFormat('en-GB', { ...opts, timeZone: 'Europe/London' }).format(new Date());
            if (document.getElementById('clock-tyo')) document.getElementById('clock-tyo').textContent = new Intl.DateTimeFormat('ja-JP', { ...opts, timeZone: 'Asia/Tokyo' }).format(new Date());
            if (document.getElementById('clock-utc')) document.getElementById('clock-utc').textContent = new Intl.DateTimeFormat('en-GB', { ...opts, timeZone: 'UTC' }).format(new Date());
        } catch(e){}
    }, 1000);

    const ratesData = {
      FED: { code: "FED", name: "Federal Reserve (FED)", rate: 3.63, nextMeeting: "2026-09-16T14:00:00", step: 0.25, implied: 3.78, trajectory: [3.63, 3.78, 3.91, 4.03, 3.88] },
      ECB: { code: "ECB", name: "European Central Bank (ECB)", rate: 2.40, nextMeeting: "2026-09-10T14:15:00", step: 0.25, implied: 2.63, trajectory: [2.40, 2.63, 2.85, 2.95, 2.80] },
      BOE: { code: "BOE", name: "Bank of England (BOE)", rate: 3.75, nextMeeting: "2026-09-17T12:00:00", step: 0.25, implied: 3.87, trajectory: [3.75, 3.87, 4.00, 4.10, 3.95] },
      RBA: { code: "RBA", name: "Reserve Bank of Australia (RBA)", rate: 4.35, nextMeeting: "2026-09-29T14:30:00", step: 0.25, implied: 4.53, trajectory: [4.35, 4.53, 4.70, 4.80, 4.65] },
      BOC: { code: "BOC", name: "Bank of Canada (BOC)", rate: 2.25, nextMeeting: "2026-09-02T10:00:00", step: 0.25, implied: 2.33, trajectory: [2.25, 2.33, 2.40, 2.50, 2.35] },
      RBNZ: { code: "RBNZ", name: "Reserve Bank of NZ (RBNZ)", rate: 2.50, nextMeeting: "2026-09-02T14:00:00", step: 0.25, implied: 2.64, trajectory: [2.50, 2.64, 2.78, 2.92, 2.75] },
      BOJ: { code: "BOJ", name: "Bank of Japan (BOJ)", rate: 1.00, nextMeeting: "2026-09-17T12:00:00", step: 0.10, implied: 1.20, trajectory: [1.00, 1.20, 1.35, 1.50, 1.60] },
      SNB: { code: "SNB", name: "Swiss National Bank (SNB)", rate: 0.00, nextMeeting: "2026-09-24T09:30:00", step: 0.25, implied: 0.05, trajectory: [0.00, 0.05, 0.10, 0.15, 0.05] }
    };

    let currentSortColumn = 'nextMeeting';
    let sortAscending = true;

    function classifyPolicyTone(deltaBps, outcome) {
      if (deltaBps >= 20) {
        return { label: "Strongly Hawkish", class: "text-emerald-300 bg-emerald-950/80 border-emerald-500/50", weight: 4 };
      } else if (deltaBps >= 10 && outcome === "HIKE") {
        return { label: "Hawkish / Hike Bias", class: "text-emerald-400 bg-emerald-950/50 border-emerald-500/30", weight: 3 };
      } else if (outcome === "HOLD" && deltaBps > 5) {
        return { label: "Hawkish Hold / Skip", class: "text-teal-300 bg-teal-950/50 border-teal-500/30", weight: 2 };
      } else if (Math.abs(deltaBps) <= 5) {
        return { label: "Data-Dependent / Neutral", class: "text-zinc-300 bg-zinc-800/60 border-zinc-700", weight: 1 };
      } else if (outcome === "HOLD" && deltaBps < -5) {
        return { label: "Dovish Hold / Patient", class: "text-amber-300 bg-amber-950/50 border-amber-500/30", weight: -1 };
      } else if (deltaBps <= -6 && deltaBps > -18) {
        return { label: "Dovish Pivot / Soft Pivot", class: "text-rose-300 bg-rose-950/50 border-rose-500/30", weight: -2 };
      } else {
        return { label: "Strongly Dovish / Accommodative", class: "text-rose-400 bg-rose-950/80 border-rose-500/50", weight: -3 };
      }
    }

    function switchBankView(view) {
      const container = document.getElementById('terminalViewContainer');
      if (view === "Overview") {
        renderOverview(container);
      } else {
        renderDrilldown(container, view);
      }
    }

    function sortTable(column) {
      if (currentSortColumn === column) {
        sortAscending = !sortAscending;
      } else {
        currentSortColumn = column;
        sortAscending = true;
      }
      renderOverview(document.getElementById('terminalViewContainer'));
    }

    function renderOverview(container) {
      let rows = Object.values(ratesData).map(b => {
        const deltaBps = (b.implied - b.rate) * 100;
        const prob = Math.min(Math.max(Math.abs(deltaBps) / (b.step * 100) * 100, 0), 100);
        const outcome = deltaBps > (b.step * 50) ? "HIKE" : (deltaBps < -(b.step * 50) ? "CUT" : "HOLD");
        const tone = classifyPolicyTone(deltaBps, outcome);
        return { ...b, deltaBps, prob, outcome, tone };
      });

      rows.sort((a, b) => {
        let valA = a[currentSortColumn];
        let valB = b[currentSortColumn];
        if (currentSortColumn === 'tone') {
          valA = a.tone.weight;
          valB = b.tone.weight;
        }
        if (valA < valB) return sortAscending ? -1 : 1;
        if (valA > valB) return sortAscending ? 1 : -1;
        return 0;
      });

      let html = `
        <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-6">
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold text-white uppercase tracking-wider font-mono">G10 Implied Rate Expectations & Automated Policy Tone Matrix</h3>
            <span class="text-[10px] text-zinc-500 font-mono">💡 Click column headers to sort</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs text-left font-mono">
              <thead>
                <tr class="text-zinc-500 text-[10px] border-b border-zinc-800 uppercase select-none">
                  <th class="p-3 sortable" onclick="sortTable('nextMeeting')">Next Meeting ↕</th>
                  <th class="p-3 sortable" onclick="sortTable('name')">Central Bank ↕</th>
                  <th class="p-3 text-center sortable" onclick="sortTable('rate')">Current Rate ↕</th>
                  <th class="p-3 text-center sortable" onclick="sortTable('implied')">Implied Rate ↕</th>
                  <th class="p-3 text-center sortable" onclick="sortTable('deltaBps')">Delta (bps) ↕</th>
                  <th class="p-3 text-center sortable" onclick="sortTable('prob')">Probability ↕</th>
                  <th class="p-3 text-center sortable" onclick="sortTable('outcome')">Outcome ↕</th>
                  <th class="p-3 text-center sortable" onclick="sortTable('tone')">Automated Policy Tone ↕</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-zinc-800/50">
      `;

      rows.forEach(b => {
        const outcomeColor = b.outcome === "HIKE" ? "text-emerald-400 bg-emerald-950/40 border-emerald-500/30" : (b.outcome === "CUT" ? "text-rose-400 bg-rose-950/40 border-rose-500/30" : "text-zinc-400 bg-zinc-900 border-zinc-700");

        html += `
          <tr class="hover:bg-[#0a0a0f] transition">
            <td class="p-3 text-zinc-400 font-bold">${b.nextMeeting.split('T')[0]}</td>
            <td class="p-3 font-bold text-white">${b.name}</td>
            <td class="p-3 text-center text-zinc-300">${b.rate.toFixed(2)}%</td>
            <td class="p-3 text-center text-cyan-400 font-bold">${b.implied.toFixed(2)}%</td>
            <td class="p-3 text-center text-zinc-300">${b.deltaBps > 0 ? '+' : ''}${b.deltaBps.toFixed(1)}</td>
            <td class="p-3 text-center text-zinc-300">${b.prob.toFixed(1)}%</td>
            <td class="p-3 text-center"><span class="px-2 py-0.5 rounded border text-[10px] font-bold ${outcomeColor}">${b.outcome}</span></td>
            <td class="p-3 text-center"><span class="px-2.5 py-1 rounded-lg border text-[10px] font-bold tracking-wide ${b.tone.class}">${b.tone.label}</span></td>
          </tr>
        `;
      });

      html += `</tbody></table></div></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-5 shadow-lg"><div id="chartRel" style="height:400px;"></div></div>
          <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-5 shadow-lg"><div id="chartAbs" style="height:400px;"></div></div>
        </div>
      `;

      container.innerHTML = html;
      renderOverviewCharts();
    }

    function renderOverviewCharts() {
      const timeline = ["Current", "Sep '26", "Oct '26", "Dec '26", "Q1 '27"];
      let tracesRel = [], tracesAbs = [];

      Object.keys(ratesData).forEach(key => {
        const b = ratesData[key];
        const path = b.trajectory;
        const relPath = path.map(p => (p - path[0]) * 100);

        tracesRel.push({ x: timeline, y: relPath, name: key, mode: 'lines+markers' });
        tracesAbs.push({ x: timeline, y: path, name: key, mode: 'lines+markers' });
      });

      const layout = { template: 'plotly_dark', paper_bgcolor: '#07080d', plot_bgcolor: '#07080d', margin: { t: 30, l: 40, r: 20, b: 30 }, height: 380 };
      Plotly.newPlot('chartRel', tracesRel, { ...layout, title: 'Implied Policy Rate Paths: Relative (bps)' });
      Plotly.newPlot('chartAbs', tracesAbs, { ...layout, title: 'Implied Policy Rate Paths: Level (%)' });
    }

    function renderDrilldown(container, bankCode) {
      const b = ratesData[bankCode];
      const deltaBps = (b.implied - b.rate) * 100;
      const outcome = deltaBps > (b.step * 50) ? "HIKE" : (deltaBps < -(b.step * 50) ? "CUT" : "HOLD");
      const tone = classifyPolicyTone(deltaBps, outcome);

      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-6 shadow-xl flex flex-col justify-center items-center text-center font-mono">
            <span class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-2">Next Decision Countdown</span>
            <div id="countdownClock" class="text-xl font-black text-cyan-400">Loading...</div>
          </div>
          <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-6 shadow-xl flex flex-col justify-center items-center text-center font-mono">
            <span class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-1">Current Rate</span>
            <div class="text-3xl font-black text-white">${b.rate.toFixed(2)}%</div>
          </div>
          <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-6 shadow-xl flex flex-col justify-center items-center text-center font-mono">
            <span class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-1">12-Month Outlook</span>
            <div class="text-3xl font-black text-emerald-400">+25.0 bps</div>
          </div>
          <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-6 shadow-xl flex flex-col justify-center items-center text-center font-mono">
            <span class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-2">Evaluated Tone</span>
            <span class="px-3 py-1 rounded-lg border text-xs font-bold tracking-wide ${tone.class}">${tone.label}</span>
          </div>
        </div>
        <div class="bg-[#07080d] border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-4">
          <h3 class="text-xs font-bold text-white uppercase tracking-wider font-mono">Path of Policy Rate: Market Expectation (${b.name})</h3>
          <div id="drilldownChart" style="height:400px;"></div>
        </div>
      `;

      setInterval(() => {
        const diff = new Date(b.nextMeeting).getTime() - new Date().getTime();
        if (diff < 0) { document.getElementById('countdownClock').textContent = "DECISION LIVE"; return; }
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / 1000 / 60) % 60);
        const s = Math.floor((diff / 1000) % 60);
        document.getElementById('countdownClock').textContent = `${d}d ${h}h ${m}m ${s}s`;
      }, 1000);

      const timeline = ["Current", "Meeting 1", "Meeting 2", "Meeting 3", "Meeting 4"];
      const curves = [
        { x: timeline, y: b.trajectory, name: 'Current', line: { width: 3, color: '#22d3ee' } },
        { x: timeline, y: b.trajectory.map(v => v - 0.05), name: '1w ago', line: { color: '#f59e0b' } },
        { x: timeline, y: b.trajectory.map(v => v - 0.12), name: '6w ago', line: { color: '#10b981' } }
      ];
      Plotly.newPlot('drilldownChart', curves, { template: 'plotly_dark', paper_bgcolor: '#07080d', plot_bgcolor: '#07080d', margin: { t: 20, l: 40, r: 20, b: 30 }, height: 380, title: 'Historical Path Comparison (%)' });
    }

    document.addEventListener("DOMContentLoaded", () => {
      switchBankView("Overview");
    });
  </script>
</body>
</html>
